name: NodeSeek 纯自动签到

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'  # UTC 16:00 (北京时间 00:00)

permissions:
  actions: write
  contents: write

jobs:
  run-nodeseek-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable jq unzip
          
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
          echo "Chrome major version: $CHROME_MAJOR_VERSION"
          
          wget -q https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json -O versions.json
          CHROMEDRIVER_URL=$(jq -r --arg major "$CHROME_MAJOR_VERSION" '.versions[] | select(.version | startswith($major + ".")) | .downloads.chromedriver[]? | select(.platform == "linux64") | .url' versions.json | tail -1)
          
          if [ -z "$CHROMEDRIVER_URL" ]; then
            CHROMEDRIVER_URL=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json" | jq -r '.channels.Stable.downloads.chromedriver[] | select(.platform=="linux64") | .url')
          fi
          
          echo "Downloading: $CHROMEDRIVER_URL"
          wget -q "$CHROMEDRIVER_URL" -O chromedriver.zip
          unzip -q -o chromedriver.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium>=4.18.1 requests>=2.31.0 undetected-chromedriver>=3.5.5

      - name: Run NodeSeek checkin
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_RANDOM: "true"
          HEADLESS: "true"
        run: |
          python -u nodeseek_sign_only.py

      - name: Keepalive Workflow
        uses: liskin/gh-workflow-keepalive@v1
        continue-on-error: true
